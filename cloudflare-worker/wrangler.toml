name = "trafficbot-mcp-proxy"
main = "src/worker.js"
compatibility_date = "2025-07-01"

# Custom Domain: Cloudflare auto-creates the DNS record + TLS cert for
# mcp.ixo.app and routes ALL paths (including root well-known probes) to this
# Worker. Requires ixo.app to be an active zone on this Cloudflare account.
[[routes]]
pattern = "mcp.ixo.app"
custom_domain = true
