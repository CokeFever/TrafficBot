# fly.toml app configuration file generated for telegram-parking-bot
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "telegram-parking-bot"
primary_region = "hkg" # Hong Kong (closest to Taiwan)

[build]
  [build.env]
    NODE_ENV = "production"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
