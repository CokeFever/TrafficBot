name: Deploy to Supabase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: yqpigatgtxvytmkxumxu
        run: |
          # Link project
          supabase link --project-ref $SUPABASE_PROJECT_ID
          
          # Push database migrations
          supabase db push
          
          # Deploy Edge Functions
          supabase functions deploy telegram-webhook --no-verify-jwt
          supabase functions deploy daily-report --no-verify-jwt

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Function URL: https://yqpigatgtxvytmkxumxu.supabase.co/functions/v1/telegram-webhook"
          echo "⚠️  Note: JWT verification is disabled for this function"
      
      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."
          exit 1
